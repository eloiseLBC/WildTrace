version: '3.8'

services:
  # Votre PostgreSQL existant
  postgres:
    image: postgres:15
    container_name: wildtrace-postgres
    environment:
      POSTGRES_DB: wildtrace
      POSTGRES_USER: wildtrace
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # Script d'initialisation
    ports:
      - "5432:5432"
    networks:
      - wildtrace-network

  # Interface Adminer
  adminer:
    image: adminer:latest
    container_name: wildtrace-adminer
    ports:
      - "8080:8080"  # Interface accessible sur http://localhost:8080
    networks:
      - wildtrace-network
    depends_on:
      - postgres

  # Alternative: pgAdmin (plus avancé)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wildtrace-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: eloise.leblanc@hotmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"  # Interface sur http://localhost:5050
    networks:
      - wildtrace-network
    depends_on:
      - postgres
    # Optionnel: configuration pré-définie
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json

volumes:
  postgres_data:

networks:
  wildtrace-network:
    driver: bridge