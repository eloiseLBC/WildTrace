name: Tests on develop branch

# Déclenche la pipeline sur push et pull request vers develop
on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Récupère le code source
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install coverage pytest-cov

      - name: Run tests with coverage
        env:
          OPEN_CAGE_GEOCODE_APIKEY: ${{ secrets.OPEN_CAGE_GEOCODE_APIKEY }}
        run: |
          coverage run -m pytest test/ -v

      - name: Generate coverage reports
        run: |
          coverage report -m
          coverage html
          coverage xml

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: htmlcov/
          retention-days: 30

      - name: Upload coverage XML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-report
          path: coverage.xml
          retention-days: 30
              

  check-source-branch:
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - name: Check if PR is from develop
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "😔 Les PR vers main ne peuvent venir que de develop"
            echo "Branche source actuelle: ${{ github.head_ref }}"
            exit 1
          fi
          echo "🫡 PR autorisée depuis develop"

  all_checks-passed:
    needs: [test, check-source-branch]
    if : always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          # Vérifier que tous les jobs précédents ont réussi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "🚩 Test job failed"
            exit 1
          fi
          
          if [ "${{ needs.check-source-branch.result }}" != "success" && "${{ github.base_ref }}" == "main" ]; then
            echo "🚩 Check source branch job failed"
            exit 1
          fi
          
          echo "🫡 Tous les checks CI/CD sont passés avec succès !"
          echo "😎 Le merge peut être effectué"
