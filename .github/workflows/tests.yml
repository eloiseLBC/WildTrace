name: Tests on develop branch

# Déclenche la pipeline sur push et pull request vers develop
on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Récupère le code source
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        env:
          OPEN_CAGE_GEOCODE_APIKEY: ${{ secrets.OPEN_CAGE_GEOCODE_APIKEY }}
        run: |
          for file in test/*.py; do
            if [ -f "$file" ]; then
              echo "🫡Testing $file"
              python -m pytest "$file" -v
            fi
          done